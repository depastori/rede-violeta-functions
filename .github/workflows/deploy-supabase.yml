name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install / Prepare Supabase CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "Chosen asset URL: ${ASSET_URL:-<none>}"

          # If an asset URL is provided (from a previous step or secret), download and extract it
          if [ -n "${ASSET_URL:-}" ]; then
            echo "Downloading asset..."
            curl -L --fail -o supabase_asset "$ASSET_URL" || { echo "ERROR: download failed for $ASSET_URL"; exit 1; }
            file supabase_asset || true

            # handle common formats
            if file supabase_asset | grep -qi 'gzip'; then
              echo "Extracting tar.gz..."
              # Prevent tar extraction from failing when a previous 'supabase' file/dir exists
              rm -rf supabase
              tar -xzf supabase_asset || { echo "ERROR: tar extraction failed"; exit 1; }

              # try to find the extracted binary
              SUPABASE_BIN="$(find . -type f -name supabase -perm -111 -print -quit || true)"
            elif file supabase_asset | grep -qi 'Debian'; then
              echo "Installing .deb..."
              sudo dpkg -i supabase_asset || { echo "ERROR: dpkg failed"; exit 1; }
              SUPABASE_BIN="$(which supabase || true)"
            else
              echo "Unknown asset format; skipping asset install."
              SUPABASE_BIN=""
            fi
          else
            SUPABASE_BIN=""
          fi

          # Fallback to npm if no binary found
          if [ -z "${SUPABASE_BIN:-}" ]; then
            echo "No binary found from release assets — falling back to npm install"
            npm install -g supabase || { echo "ERROR: npm install -g supabase failed"; exit 1; }
            SUPABASE_BIN="$(which supabase || true)"
          fi

          if [ -z "${SUPABASE_BIN:-}" ]; then
            echo "ERROR: supabase binary not found after all attempts"; exit 1
          fi

          echo "SUPABASE_BIN=$SUPABASE_BIN" >> "$GITHUB_ENV"
          echo "Using supabase binary at: $SUPABASE_BIN"

      - name: Deploy Supabase Edge Function
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          set -euo pipefail

          # Nome da função (já definido)
          FUNCTION_NAME="make-server-370b3cd1"

          if [ -z "${SUPABASE_BIN:-}" ]; then
            echo "ERROR: SUPABASE_BIN not set in environment"
            exit 1
          fi

          # Deploy
          $SUPABASE_BIN functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --token "$SUPABASE_TOKEN" || { echo "ERROR: supabase functions deploy failed"; exit 1; }
