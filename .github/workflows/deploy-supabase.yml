name: Determine Supabase CLI asset URL
  shell: bash
  env:
    ASSET_URL: ${{ secrets.SUPABASE_ASSET_URL }}
  run: |
    set -euo pipefail

    if [ -n "${ASSET_URL:-}" ]; then
      echo "Using ASSET_URL from env/secret"
      echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"
      exit 0
    fi

    REPO="supabase/cli"
    ARCH_UNAME="$(uname -m)"
    case "$ARCH_UNAME" in
      x86_64) ARCH="amd64" ;;
      aarch64|arm64) ARCH="arm64" ;;
      *) ARCH="$ARCH_UNAME" ;;
    esac

    # Use sed to reliably pull browser_download_url from JSON, then filter by linux + arch
    ASSET_URL="$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" \
      | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
      | grep -i "linux" \
      | grep -i "$ARCH" \
      | grep -iE "tar.gz|tgz" \
      | head -n1 || true)"

    # fallback to .deb if no tar.gz found
    if [ -z "$ASSET_URL" ]; then
      ASSET_URL="$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" \
        | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
        | grep -i "linux" \
        | grep -i "$ARCH" \
        | grep -i '\.deb' \
        | head -n1 || true)"
    fi

    echo "Chosen asset URL: ${ASSET_URL:-<none>}"
    if [ -z "${ASSET_URL:-}" ]; then
      echo "ERROR: Could not determine a suitable Supabase CLI asset for this runner. Set SUPABASE_ASSET_URL secret to a release tar.gz/.deb URL."
      exit 1
    fi

    echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"
