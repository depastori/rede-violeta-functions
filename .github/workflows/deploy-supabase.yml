name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI (robust download & extract)
        run: |
          set -euo pipefail
          echo "Fetching latest release metadata..."
          RELEASE_JSON=$(curl -s https://api.github.com/repos/supabase/cli/releases/latest)
          echo "$RELEASE_JSON" | python3 -c "import sys,json; j=json.load(sys.stdin); print('tag='+j.get('tag_name',''))"
          ASSET_URL=$(echo "$RELEASE_JSON" | python3 - <<'PY'
import sys, json
r = json.load(sys.stdin)
assets = r.get("assets", [])
# prefer filenames containing linux and amd64/x86_64
for a in assets:
    name = a.get("name","").lower()
    if "linux" in name and ("amd64" in name or "x86_64" in name):
        print(a.get("browser_download_url",""))
        sys.exit(0)
# fallback: try any asset containing 'linux'
for a in assets:
    name = a.get("name","").lower()
    if "linux" in name:
        print(a.get("browser_download_url",""))
        sys.exit(0)
print("", end="")
PY
)
          if [ -z "$ASSET_URL" ]; then
            echo "No suitable linux asset found in release metadata. Showing release JSON for debug:"
            echo "$RELEASE_JSON"
            exit 1
          fi
          echo "Downloading asset: $ASSET_URL"
          curl -L "$ASSET_URL" -o supabase_asset || { echo "Download failed"; exit 1; }
          # inspect file type
          FILETYPE=$(file supabase_asset || true)
          echo "Downloaded file type: $FILETYPE"
          if echo "$ASSET_URL" | grep -E '\.tar\.gz$|\.tgz$' >/dev/null 2>&1 || echo "$FILETYPE" | grep -i gzip >/dev/null 2>&1; then
            tar -xzf supabase_asset || { echo "Tar extraction failed"; ls -la; exit 1; }
          elif echo "$ASSET_URL" | grep -E '\.zip$' >/dev/null 2>&1 || echo "$FILETYPE" | grep -i zip >/dev/null 2>&1; then
            apt-get update -y && apt-get install -y unzip
            unzip supabase_asset || { echo "Unzip failed"; ls -la; exit 1; }
          else
            # if it's an executable binary directly
            chmod +x supabase_asset
            mv supabase_asset supabase || true
          fi
          # find the supabase binary after extraction
          SUPABASE_BIN=$(find . -maxdepth 3 -type f -iname 'supabase*' -perm -111 2>/dev/null | head -n 1 || true)
          if [ -z "$SUPABASE_BIN" ]; then
            # try common binary name
            if [ -f "./supabase" ]; then
              SUPABASE_BIN="./supabase"
            else
              echo "Could not find supabase binary after extraction. Listing files:"
              ls -la
              exit 1
            fi
          fi
          echo "Found supabase binary at: $SUPABASE_BIN"
          sudo mv "$SUPABASE_BIN" /usr/local/bin/supabase
          /usr/local/bin/supabase --version

      - name: Deploy function
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          /usr/local/bin/supabase --version
          /usr/local/bin/supabase functions deploy make-server-370b3cd1 --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_SERVICE_ROLE_KEY"
