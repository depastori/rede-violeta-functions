name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI (download specific asset, no heredoc)
        run: |
          set -euo pipefail
          echo "Fetching latest release metadata..."
          SUPABASE_CLI_TAG=$(curl -s https://api.github.com/repos/supabase/cli/releases/latest | sed -n 's/.*"tag_name": *"\([^"]]*\)".*/\1/p')
          if [ -z "$SUPABASE_CLI_TAG" ]; then
            echo "ERROR: could not determine latest tag"; exit 1
          fi
          SUPABASE_CLI_VER=${SUPABASE_CLI_TAG#v}
          echo "Latest tag: $SUPABASE_CLI_TAG -> version: $SUPABASE_CLI_VER"
          ASSET_URL="https://github.com/supabase/cli/releases/download/${SUPABASE_CLI_TAG}/supabase_${SUPABASE_CLI_VER}_linux_amd64.tar.gz"
          echo "Attempting download from: $ASSET_URL"
          curl -L --fail -o supabase_asset.tar.gz "$ASSET_URL" || { echo "Download failed"; exit 1; }
          echo "Downloaded — checking archive..."
          if tar -tzf supabase_asset.tar.gz >/dev/null 2>&1; then
            tar -xzf supabase_asset.tar.gz
          else
            # try unzip if zip
            if file supabase_asset.tar.gz | grep -qi zip >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y unzip
              unzip supabase_asset.tar.gz
            else
              # assume binary
              chmod +x supabase_asset.tar.gz
              mv supabase_asset.tar.gz supabase || true
            fi
          fi
          SUPABASE_BIN=$(find . -maxdepth 3 -type f -iname 'supabase*' -perm -111 2>/dev/null | head -n 1 || true)
          if [ -z "$SUPABASE_BIN" ]; then
            if [ -f "./supabase" ]; then
              SUPABASE_BIN="./supabase"
            else
              echo "Could not find supabase binary after extraction"; ls -la; exit 1
            fi
          fi
          echo "Found supabase binary at: $SUPABASE_BIN"
          sudo mv "$SUPABASE_BIN" /usr/local/bin/supabase
          /usr/local/bin/supabase --version

      - name: Deploy function
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          /usr/local/bin/supabase --version
          /usr/local/bin/supabase functions deploy make-server-370b3cd1 --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_SERVICE_ROLE_KEY"
