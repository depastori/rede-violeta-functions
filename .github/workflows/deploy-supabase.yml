name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI (robust download & extract)
        run: |
          set -euo pipefail
          echo "=== Fetching latest release metadata from GitHub API ==="
          # Request with headers to reduce chance of rejection
          RELEASE_JSON=$(curl -sS -H "User-Agent: GitHub-Actions" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/supabase/cli/releases/latest" || true)
          echo "Raw release JSON snippet (first 400 chars):"
          printf '%s\n' "${RELEASE_JSON:0:400}"
          SUPABASE_CLI_TAG=$(printf '%s' "$RELEASE_JSON" | python3 -c "import sys, json; d=sys.stdin.read(); print(json.loads(d).get('tag_name','') if d.strip() else '')" 2>/dev/null || true)
          FALLBACK_TAG="v2.58.5"
          if [ -z "$SUPABASE_CLI_TAG" ]; then
            echo "WARN: could not determine latest tag from API. Falling back to $FALLBACK_TAG"
            SUPABASE_CLI_TAG="$FALLBACK_TAG"
          fi
          SUPABASE_CLI_VER=${SUPABASE_CLI_TAG#v}
          echo "Using supabase cli tag: $SUPABASE_CLI_TAG (ver: $SUPABASE_CLI_VER)"
          ASSET_URL="https://github.com/supabase/cli/releases/download/${SUPABASE_CLI_TAG}/supabase_${SUPABASE_CLI_VER}_linux_amd64.tar.gz"
          echo "Attempting download from: $ASSET_URL"
          # download (fail fast)
          curl -L --fail -o supabase_asset.tar.gz "$ASSET_URL" || { echo "ERROR: download failed for $ASSET_URL"; exit 1; }
          echo "Downloaded — checking archive..."
          if tar -tzf supabase_asset.tar.gz >/dev/null 2>&1; then
            tar -xzf supabase_asset.tar.gz
          else
            if file supabase_asset.tar.gz | grep -qi zip >/dev/null 2>&1; then
              echo "Detected zip file — installing unzip and extracting"
              sudo apt-get update -y
              sudo apt-get install -y unzip
              unzip supabase_asset.tar.gz
            else
              echo "Not a recognized archive; treating as binary"
              chmod +x supabase_asset.tar.gz
              mv supabase_asset.tar.gz supabase || true
            fi
          fi
          SUPABASE_BIN=$(find . -maxdepth 3 -type f -iname 'supabase*' -perm -111 2>/dev/null | head -n 1 || true)
          if [ -z "$SUPABASE_BIN" ]; then
            if [ -f "./supabase" ]; then
              SUPABASE_BIN="./supabase"
            else
              echo "ERROR: Could not find supabase binary after extraction. Listing files:"
              ls -la
              exit 1
            fi
          fi
          echo "Found supabase binary at: $SUPABASE_BIN"
          sudo mv "$SUPABASE_BIN" /usr/local/bin/supabase
          echo "Supabase CLI version:"
          /usr/local/bin/supabase --version || true

      - name: Deploy function
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Supabase CLI before deploy:"
          /usr/local/bin/supabase --version || true
          echo "Deploying function make-server-370b3cd1..."
          /usr/local/bin/supabase functions deploy make-server-370b3cd1 --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_SERVICE_ROLE_KEY"
