name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # DEBUG TEMP: verifica presença dos secrets (remova depois)
      - name: Debug: presence of relevant secrets
        shell: bash
        run: |
          echo "Checking presence of secrets (values are masked)"
          if [ -n "${{ secrets.SUPABASE_ASSET_URL }}" ]; then
            echo "SUPABASE_ASSET_URL: present"
          else
            echo "SUPABASE_ASSET_URL: MISSING"
          fi

          if [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "SUPABASE_PROJECT_REF: present"
          else
            echo "SUPABASE_PROJECT_REF: MISSING"
          fi

          if [ -n "${{ secrets.SUPABASE_TOKEN }}" ]; then
            echo "SUPABASE_TOKEN: present"
          else
            echo "SUPABASE_TOKEN: MISSING"
          fi

          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY: present (fallback)"
          else
            echo "SUPABASE_SERVICE_ROLE_KEY: NOT present"
          fi

      - name: Determine Supabase CLI asset URL
        shell: bash
        env:
          SUPABASE_ASSET_URL: ${{ secrets.SUPABASE_ASSET_URL }}
        run: |
          set -euo pipefail

          if [ -n "${SUPABASE_ASSET_URL:-}" ]; then
            echo "Using SUPABASE_ASSET_URL from secret"
            echo "ASSET_URL=$SUPABASE_ASSET_URL" >> "$GITHUB_ENV"
            exit 0
          fi

          REPO="supabase/cli"
          ARCH_UNAME="$(uname -m)"
          case "$ARCH_UNAME" in
            x86_64|x64|x86-64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
            *) ARCH="$ARCH_UNAME" ;;
          esac

          ASSET_URL="$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" \
            | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
            | grep -i "linux" \
            | grep -i "$ARCH" \
            | grep -iE "tar.gz|tgz" \
            | head -n1 || true)"

          if [ -z "$ASSET_URL" ]; then
            ASSET_URL="$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" \
              | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
              | grep -i "linux" \
              | grep -i "$ARCH" \
              | grep -i '\.deb' \
              | head -n1 || true)"
          fi

          echo "Chosen asset URL: ${ASSET_URL:-<none>}"
          if [ -z "${ASSET_URL:-}" ]; then
            echo "ERROR: Could not determine a suitable Supabase CLI asset for this runner. Set SUPABASE_ASSET_URL secret to a release tar.gz/.deb URL."
            exit 1
          fi

          echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"

      - name: Install / Prepare Supabase CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading asset from: ${ASSET_URL}"
          curl -L --fail -o supabase_asset "$ASSET_URL" || { echo "ERROR: download failed for $ASSET_URL"; exit 1; }
          file supabase_asset || true

          if file supabase_asset | grep -qi 'gzip'; then
            echo "Extracting tar.gz..."
            rm -rf supabase
            tar -](#)
