name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Supabase CLI asset URL (uses secret SUPABASE_ASSET_URL if provided)
        id: determine_asset
        run: |
          set -euo pipefail
          echo "Checking SUPABASE_ASSET_URL secret..."
          if [ -n "${{ secrets.SUPABASE_ASSET_URL }}" ]; then
            echo "Chosen asset URL from secret"
            echo "::set-output name=url::${{ secrets.SUPABASE_ASSET_URL }}"
            exit 0
          fi
          echo "No SUPABASE_ASSET_URL secret set — attempting to detect latest linux amd64 asset from GitHub releases..."
          RELEASE_JSON=$(curl -sS -H "User-Agent: GitHub-Actions" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/supabase/cli/releases/latest" || true)
          echo "Snippet: ${RELEASE_JSON:0:300}"
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" \
            | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
            | grep -i "linux" \
            | grep -i "amd64" \
            | egrep -i '\.tar\.gz$|\.tgz$|\.deb$' \
            | head -n1 || true)
          if [ -n "$ASSET_URL" ]; then
            echo "Detected asset URL: $ASSET_URL"
            echo "::set-output name:url::$ASSET_URL"
            exit 0
          fi
          echo "No suitable asset found in latest release — leaving output empty to allow npm fallback."
          echo "::set-output name:url::"
      - name: Install / Prepare Supabase CLI
        run: |
          set -euo pipefail
          ASSET_URL="${{ steps.determine_asset.outputs.url }}"
          echo "Asset URL: ${ASSET_URL:-<none>}"
          # Try to download & install if URL present
          if [ -n "$ASSET_URL" ]; then
            echo "Downloading asset..."
            curl -L --fail -o supabase_asset "$ASSET_URL" || { echo "ERROR: download failed for $ASSET_URL"; exit 1; }
            file supabase_asset || true
            if file supabase_asset | grep -qi 'gzip'; then
              echo "Extracting tar.gz..."
              tar -xzf supabase_asset || { echo "ERROR: tar extraction failed"; exit 1; }
            elif file supabase_asset | grep -qi 'Debian'; then
              echo "Installing .deb..."
              sudo apt-get update -y
              sudo apt-get install -y wget ca-certificates
              sudo dpkg -i supabase_asset || sudo apt-get install -y -f
            else
              echo "Treating download as binary"
              chmod +x supabase_asset || true
              mv supabase_asset supabase || true
            fi
            SUPABASE_BIN=$(find . -maxdepth 3 -type f -iname 'supabase*' -perm -111 2>/dev/null | head -n 1 || true)
            if [ -z "$SUPABASE_BIN" ]; then
              if [ -x "/usr/bin/supabase" ]; then SUPABASE_BIN="/usr/bin/supabase"; fi
              if [ -x "/usr/local/bin/supabase" ]; then SUPABASE_BIN="/usr/local/bin/supabase"; fi
              if [ -f "./supabase" ]; then SUPABASE_BIN="./supabase"; fi
            fi
            if [ -z "$SUPABASE_BIN" ]; then
              echo "Could not find supabase binary after install; will fallback to npm"
            else
              sudo mv "$SUPABASE_BIN" /usr/local/bin/supabase || true
            fi
          fi
          # Fallback: install via npm
          if ! command -v supabase >/dev/null 2>&1; then
            echo "Installing supabase via npm (fallback)..."
            npm install -g supabase || { echo "ERROR: npm install -g supabase failed"; exit 1; }
          fi
          echo "Supabase CLI version:"
          supabase --version || true

      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "Supabase CLI version:"
          supabase --version || true
          echo "Deploying function make-server-370b3cd1..."
          supabase functions deploy make-server-370b3cd1 --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_ACCESS_TOKEN"
