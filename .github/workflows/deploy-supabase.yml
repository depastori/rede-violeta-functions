name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Provide the token via environment variable so the CLI does not need --token flag
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # DEBUG: verifica presença dos secrets (remova depois)
      - name: "Debug: presence of relevant secrets"
        shell: bash
        run: |
          echo "Checking presence of secrets (values are masked)"
          if [ -n "${{ secrets.SUPABASE_ASSET_URL }}" ]; then
            echo "SUPABASE_ASSET_URL: present"
          else
            echo "SUPABASE_ASSET_URL: MISSING"
          fi
          if [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "SUPABASE_PROJECT_REF: present"
          else
            echo "SUPABASE_PROJECT_REF: MISSING"
          fi
          if [ -n "${{ secrets.SUPABASE_TOKEN }}" ]; then
            echo "SUPABASE_TOKEN: present"
          else
            echo "SUPABASE_TOKEN: MISSING"
          fi

      # Example step to install/use supabase CLI. Adjust if you have a custom install step.
      - name: Install supabase CLI (fallback to npm)
        shell: bash
        run: |
          echo "Ensuring supabase CLI is available"
          if ! command -v supabase >/dev/null 2>&1; then
            echo "supabase CLI not found — installing via npm (fallback)"
            npm install -g supabase
          fi
          echo "Supabase CLI version:"
          supabase --version || true

      # Deploy step: do not pass --token; CLI reads SUPABASE_ACCESS_TOKEN from env
      - name: Deploy Supabase functions
        shell: bash
        run: |
          echo "Deploying Supabase functions"
          # Example: replace with your actual function name and project ref
          # supabase functions deploy <function-name> --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          echo "Deploy command would run here with SUPABASE_ACCESS_TOKEN from environment"
          echo "Note: Authentication via SUPABASE_ACCESS_TOKEN env var (no --token flag needed)"
