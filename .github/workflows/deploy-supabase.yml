name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI (download specific asset)
        run: |
          set -euo pipefail
          echo "Getting latest tag from GitHub API..."
          SUPABASE_CLI_TAG=$(python3 - <<'PY'
import urllib.request, json, sys
resp = urllib.request.urlopen("https://api.github.com/repos/supabase/cli/releases/latest").read()
data = json.loads(resp.decode('utf-8'))
print(data.get("tag_name",""))
PY
)
          if [ -z "$SUPABASE_CLI_TAG" ]; then
            echo "Failed to read latest tag"; exit 1
          fi
          SUPABASE_CLI_VER=${SUPABASE_CLI_TAG#v}
          echo "Latest tag: $SUPABASE_CLI_TAG -> version: $SUPABASE_CLI_VER"
          ASSET_URL="https://github.com/supabase/cli/releases/download/${SUPABASE_CLI_TAG}/supabase_${SUPABASE_CLI_VER}_linux_amd64.tar.gz"
          echo "Attempting download from: $ASSET_URL"
          curl -L --fail -o supabase_asset "$ASSET_URL"
          echo "Downloaded — checking file type..."
          file supabase_asset || true
          # try tar extraction
          if tar -tzf supabase_asset >/dev/null 2>&1; then
            tar -xzf supabase_asset
          else
            # try unzip if zip
            if file supabase_asset | grep -i zip >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y unzip
              unzip supabase_asset
            else
              # assume binary
              chmod +x supabase_asset
              mv supabase_asset supabase || true
            fi
          fi
          # find binary
          SUPABASE_BIN=$(find . -maxdepth 3 -type f -iname 'supabase*' -perm -111 2>/dev/null | head -n 1 || true)
          if [ -z "$SUPABASE_BIN" ]; then
            if [ -f "./supabase" ]; then
              SUPABASE_BIN="./supabase"
            else
              echo "Could not find supabase binary after extraction"; ls -la; exit 1
            fi
          fi
          echo "Found supabase binary at: $SUPABASE_BIN"
          sudo mv "$SUPABASE_BIN" /usr/local/bin/supabase
          /usr/local/bin/supabase --version

      - name: Deploy function
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          /usr/local/bin/supabase --version
          /usr/local/bin/supabase functions deploy make-server-370b3cd1 --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_SERVICE_ROLE_KEY"
