name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # DEBUG TEMP: verifica presença dos secrets (remova depois)
      - name: "Debug: presence of relevant secrets"
        shell: bash
        run: |
          echo "Checking presence of secrets (values are masked)"
          if [ -n "${{ secrets.SUPABASE_ASSET_URL }}" ]; then
            echo "SUPABASE_ASSET_URL: present"
          else
            echo "SUPABASE_ASSET_URL: MISSING"
          fi

          if [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "SUPABASE_PROJECT_REF: present"
          else
            echo "SUPABASE_PROJECT_REF: MISSING"
          fi

          if [ -n "${{ secrets.SUPABASE_TOKEN }}" ]; then
            echo "SUPABASE_TOKEN: present"
          else
            echo "SUPABASE_TOKEN: MISSING"
          fi

          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY: present (fallback)"
          else
            echo "SUPABASE_SERVICE_ROLE_KEY: NOT present"
          fi

      - name: Determine Supabase CLI asset URL
        shell: bash
        env:
          SUPABASE_ASSET_URL: ${{ secrets.SUPABASE_ASSET_URL }}
        run: |
          set -euo pipefail

          if [ -n "${SUPABASE_ASSET_URL:-}" ]; then
            echo "Using SUPABASE_ASSET_URL from secret"
            echo "ASSET_URL=$SUPABASE_ASSET_URL" >> "$GITHUB_ENV"
            exit 0
          fi

          REPO="supabase/cli"
          ARCH_UNAME="$(uname -m)"
          case "$ARCH_UNAME" in
            x86_64|x64|x86-64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
            *) ARCH="$ARCH_UNAME" ;;
          esac

          ASSET_URL="$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" \
            | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
            | grep -i "linux" \
            | grep -i "$ARCH" \
            | grep -iE "tar.gz|tgz" \
            | head -n1 || true)"

          if [ -z "$ASSET_URL" ]; then
            ASSET_URL="$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" \
              | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
              | grep -i "linux" \
              | grep -i "$ARCH" \
              | grep -i '\\.deb' \
              | head -n1 || true)"
          fi

          echo "Chosen asset URL: ${ASSET_URL:-(none)}"
          echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"

      - name: Install Supabase CLI
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ASSET_URL:-}" ]; then
            echo "Downloading CLI from: $ASSET_URL"
            curl -L --fail -o supabase_asset "$ASSET_URL"

            file supabase_asset || true

            if file supabase_asset | grep -qi 'gzip'; then
              echo "Extracting tar.gz..."
              tar -xzf supabase_asset
            elif file supabase_asset | grep -qi 'Debian'; then
              echo "Installing .deb package..."
              sudo apt-get update -y
              sudo dpkg -i supabase_asset || sudo apt-get install -y -f
            else
              echo "Treating as executable binary"
              chmod +x supabase_asset
              mv supabase_asset supabase
            fi

            # Find the binary
            SUPABASE_BIN="$(find . -maxdepth 3 -type f -iname 'supabase*' -perm -111 2>/dev/null | head -n1 || true)"
            if [ -z "$SUPABASE_BIN" ]; then
              if [ -x "/usr/bin/supabase" ]; then SUPABASE_BIN="/usr/bin/supabase"; fi
              if [ -x "/usr/local/bin/supabase" ]; then SUPABASE_BIN="/usr/local/bin/supabase"; fi
            fi

            if [ -n "$SUPABASE_BIN" ]; then
              echo "Found supabase binary at: $SUPABASE_BIN"
              sudo mv "$SUPABASE_BIN" /usr/local/bin/supabase || true
            else
              echo "No supabase binary found; will use npm fallback"
            fi
          fi

          # Fallback to npm if CLI not installed
          if ! command -v supabase >/dev/null 2>&1; then
            echo "Installing supabase CLI via npm..."
            npm install -g supabase
          fi

          echo "Supabase CLI installed successfully"
          supabase --version

      - name: Deploy Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is not set"
            echo "Please configure either SUPABASE_TOKEN or SUPABASE_SERVICE_ROLE_KEY secret"
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "ERROR: SUPABASE_PROJECT_REF is not set"
            exit 1
          fi

          echo "Deploying Edge Function make-server-370b3cd1..."
          supabase functions deploy make-server-370b3cd1 --project-ref "$SUPABASE_PROJECT_REF"
