name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN || secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine Supabase CLI asset URL
        shell: bash
        env:
          SUPABASE_ASSET_URL: ${{ secrets.SUPABASE_ASSET_URL }}
        run: |
          set -euo pipefail

          if [ -n "${SUPABASE_ASSET_URL:-}" ]; then
            echo "Using SUPABASE_ASSET_URL from secret"
            echo "ASSET_URL=$SUPABASE_ASSET_URL" >> "$GITHUB_ENV"
            exit 0
          fi

          REPO="supabase/cli"
          ARCH_UNAME="$(uname -m)"
          case "$ARCH_UNAME" in
            x86_64|x64|x86-64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
            *) ARCH="$ARCH_UNAME" ;;
          esac

          ASSET_URL="$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" \
            | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
            | grep -i "linux" \
            | grep -i "$ARCH" \
            | grep -iE "tar.gz|tgz" \
            | head -n1 || true)"

          if [ -z "$ASSET_URL" ]; then
            ASSET_URL="$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" \
              | sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' \
              | grep -i "linux" \
              | grep -i "$ARCH" \
              | grep -i '\.deb' \
              | head -n1 || true)"
          fi

          echo "Chosen asset URL: ${ASSET_URL:-<none>}"
          if [ -z "${ASSET_URL:-}" ]; then
            echo "No suitable asset found in latest release — will fallback to npm"
            echo "ASSET_URL=" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"

      - name: Install / Prepare Supabase CLI
        shell: bash
        run: |
          set -euo pipefail

          ASSET_URL="${ASSET_URL:-}"
          # if Determine step wrote to env, read it
          if [ -z "$ASSET_URL" ]; then
            ASSET_URL="${ASSET_URL:-${{ env.ASSET_URL:-}}}"
          fi
          # prefer the env variable set by previous step
          if [ -f "$GITHUB_ENV" ]; then
            # no-op: ensures the file exists in runner environment; value already exported earlier
            :
          fi

          echo "Downloading asset from: ${ASSET_URL:-<none>}"
          if [ -n "${ASSET_URL:-}" ]; then
            curl -L --fail -o supabase_asset "$ASSET_URL" || { echo "ERROR: download failed for $ASSET_URL"; exit 1; }
            file supabase_asset || true

            if file supabase_asset | grep -qi 'gzip'; then
              echo "Extracting tar.gz..."
              rm -rf supabase
              tar -xzf supabase_asset || { echo "ERROR: tar extraction failed"; exit 1; }
              SUPABASE_BIN="$(find . -type f -name supabase -perm -111 -print -quit || true)"
              if [ -n "$SUPABASE_BIN" ]; then
                echo "Found supabase binary at: $SUPABASE_BIN"
                sudo mv -f "$SUPABASE_BIN" /usr/local/bin/supabase
                sudo chmod +x /usr/local/bin/supabase
                SUPABASE_BIN="/usr/local/bin/supabase"
              fi
            elif file supabase_asset | grep -qi 'Debian'; then
              echo "Installing .deb..."
              sudo dpkg -i supabase_asset || { echo "ERROR: dpkg failed"; exit 1; }
              SUPABASE_BIN="$(which supabase || true)"
            else
              echo "Treating download as binary"
              chmod +x supabase_asset || true
              mv supabase_asset supabase || true
              SUPABASE_BIN="./supabase"
            fi
          fi

          # Fallback: install via npm if supabase binary not found
          if ! command -v supabase >/dev/null 2>&1; then
            echo "Installing supabase via npm (fallback)..."
            npm install -g supabase || { echo "ERROR: npm install -g supabase failed"; exit 1; }
          fi

          SUPABASE_BIN="$(which supabase || echo /usr/local/bin/supabase || true)"
          if [ -z "${SUPABASE_BIN:-}" ]; then
            echo "ERROR: supabase binary not found after install"
            exit 1
          fi

          echo "SUPABASE_BIN=$SUPABASE_BIN" >> "$GITHUB_ENV"
          echo "Using supabase binary at: $SUPABASE_BIN"

      - name: Deploy Supabase Edge Function
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="make-server-370b3cd1"

          if [ -z "${SUPABASE_BIN:-}" ]; then
            echo "ERRO: SUPABASE_BIN não está definido no ambiente"
            exit 1
          fi

          echo "Versão do Supabase CLI:"
          $SUPABASE_BIN --version || true

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERRO: SUPABASE_ACCESS_TOKEN não disponível. Configure secret SUPABASE_TOKEN ou SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          echo "DEBUG: SUPABASE_ACCESS_TOKEN está definido (valor mascarado)"
          # Deploy sem --token (a CLI lê SUPABASE_ACCESS_TOKEN do env do job)
          $SUPABASE_BIN functions deploy "$FUNCTION_NAME" --project-ref "$SUPABASE_PROJECT_REF" || { echo "ERRO: supabase functions deploy falhou"; exit 1; }
